*{box-sizing:border-box;margin:0;padding:0}[hidden]{display:none!important}
html{background:var(--canvas)}html.v-open{overflow:hidden}
body{background:var(--canvas);color:var(--graphite);font-family:'Newsreader',Georgia,serif;font-optical-sizing:auto;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 300 300' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .5 0 0 0 0 .45 0 0 0 0 .36 0 0 0 .12 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
a{color:inherit;text-decoration:none}
a:hover{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:.22em}
:focus-visible{outline:1.5px solid var(--graphite);outline-offset:4px}
button{font:inherit;color:inherit}

.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:baseline;gap:24px;padding:clamp(22px,4vw,44px) var(--gx) 0;flex-wrap:wrap}
.name{font-family:'Mr De Haviland','Snell Roundhand',cursive;font-weight:400;font-size:clamp(54px,5.6vw,78px);line-height:1;letter-spacing:0;transform:rotate(-3deg);transform-origin:left 80%;white-space:nowrap}
.name i{font-family:'Newsreader',Georgia,serif;font-style:italic;font-weight:300;color:var(--accent);font-size:.4em;margin-left:.08em;display:inline-block;transform:rotate(3deg)}
.top nav{display:flex;gap:22px;font-style:italic;font-size:16px;color:var(--accent)}
.top nav a:hover{color:var(--graphite)}

/* one painting, shown large */
.lead{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding:clamp(40px,8vh,90px) var(--gx) 0}
.lead button{display:block;border:0;padding:0;background:var(--gesso);cursor:zoom-in;width:min(100%,calc((100svh - 260px) * var(--r)),560px);
  box-shadow:0 1px 2px rgba(60,48,30,.14),0 30px 60px -30px rgba(60,48,30,.5)}
.lead img{display:block;width:100%;height:auto}
.lead figcaption{margin-top:16px;font-size:17px}
.lead figcaption i{color:var(--umber);margin-left:.4em}

/* the hang */
.hang{position:relative;z-index:1;display:flex;gap:clamp(22px,3vw,48px);align-items:flex-start;padding:clamp(36px,6vh,64px) var(--gx) 100px}
.col{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:clamp(40px,4.5vw,64px)}
.work{display:flex;flex-direction:column;align-items:center;text-align:center}
.work button{display:block;width:100%;border:0;padding:0;background:var(--gesso);cursor:zoom-in;
  box-shadow:0 1px 2px rgba(60,48,30,.14),0 16px 30px -18px rgba(60,48,30,.4);transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s}
.work button:hover,.work button:focus-visible{transform:translateY(-3px);box-shadow:0 1px 2px rgba(60,48,30,.14),0 26px 48px -20px color-mix(in srgb,var(--c),rgba(60,48,30,.45) 40%)}
.work img{display:block;width:100%;height:auto}
.work figcaption{margin-top:10px;font-size:15px;line-height:1.3}
.work figcaption i{color:var(--umber);margin-left:.4em}
.foot{position:relative;z-index:1;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px 28px;margin:0 var(--gx);padding:26px 0 44px;border-top:1px solid rgba(27,47,107,.2);font-size:15px;color:var(--umber)}
.foot nav{display:flex;gap:20px;font-style:italic;color:var(--accent)}
.foot nav a:hover{color:var(--graphite)}
.order{margin-left:18px;font-style:italic}
.order button{border:0;background:none;cursor:pointer;color:var(--accent);font-style:italic;padding:0;margin-right:14px}
.order button[aria-pressed="true"]{color:var(--graphite);cursor:default}
.order button:hover{text-decoration:underline;text-underline-offset:.22em}
.order button[aria-pressed="true"]:hover{text-decoration:none}
@media(max-width:640px){.top nav{gap:16px;font-size:15px}.lead{padding-top:28px}.hang{gap:18px;padding-top:64px}.col{gap:40px}.work figcaption{font-size:14px}}
@media(prefers-reduced-motion:reduce){.work button{transition:none}}

/* viewer: the painting alone, lit in its own colour */
.v{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .3s ease;background:var(--canvas);
  --vw-max:calc(100vw - 180px);--vh-max:calc(100svh - 150px)}
.v::before{content:'';position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;--lit:color-mix(in oklab,var(--vc) 78%,#fff);
  background:radial-gradient(58vmax 48vmax at 50% 46%,color-mix(in srgb,var(--lit),transparent 35%) 0%,color-mix(in srgb,var(--lit),transparent 72%) 42%,transparent 74%)}
.v.on{opacity:1}
.v-fig{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;cursor:zoom-out}
.v-fig img{display:block;background:var(--gesso);width:min(var(--vw-max),calc(var(--vh-max) * var(--r)),calc(var(--nw) * 1.4));height:auto;aspect-ratio:var(--r);transition:opacity .2s;
  box-shadow:0 2px 3px rgba(60,48,30,.16),0 34px 70px -30px rgba(60,48,30,.55)}
.v-fig img.swap{opacity:.85}
.v-cap{text-align:center;font-size:18px;padding:0 16px}
.v-y{font-style:italic;color:var(--umber);margin-left:.4em}
.v-n{display:block;font-size:13px;color:var(--umber);margin-top:2px}
.v-x{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:20px;font-style:italic;font-size:16px;color:var(--umber);background:none;border:0;cursor:pointer;padding:6px;z-index:3}
.v-x:hover{color:var(--graphite);text-decoration:underline;text-underline-offset:.22em}
.v-x svg{display:none}
.v-nav{position:fixed;top:0;bottom:0;width:90px;border:0;background:none;cursor:pointer;color:var(--umber);display:flex;align-items:center;justify-content:center;z-index:2}
.v-nav:hover{color:var(--graphite)}.v-nav svg{width:28px;height:28px}
.v-prev{left:0}.v-next{right:0}
@media(max-width:680px){.v{--vw-max:calc(100vw - 28px);--vh-max:calc(100svh - 150px)}.v-nav{width:18%}.v-nav svg{display:none}}

<script>
/* nafsadh.art viewer: shared by every option. Whole painting, never cropped. */
const NA=(()=>{
  const D=JSON.parse(document.getElementById('works').textContent);
  const W=D.works,P=document.body.dataset.p||'../painting/';
  const $=id=>document.getElementById(id);
  const v=$('v'),vi=$('vi'),vt=$('vt'),vy=$('vy'),vn=$('vn'),vx=$('vx'),vp=$('vprev'),vq=$('vnext');
  const src=(w,thumb)=>P+w.s+(thumb?'.thumb.jpg':'.jpg');
  let seq=W.map((_,i)=>i),k=-1,back=null,tok=0,curFull='';
  const LOADED=new Set();
  function warm(u,cb){if(!u)return;if(LOADED.has(u)){cb&&cb();return;}const im=new Image();im.onload=()=>{LOADED.add(u);cb&&cb();};im.src=u;}
  const st=document.createElement('style');st.textContent='.v{touch-action:pinch-zoom;overscroll-behavior:contain}@media (hover:none){.v .v-x span{display:none}.v .v-x{padding:10px}}';document.head.append(st);
  function show(j){
    k=(j+seq.length)%seq.length;const w=W[seq[k]],t=++tok;
    v.style.setProperty('--vc',w.c);
    vi.classList.add('swap');
    v.style.setProperty('--r',(w.w/w.h).toFixed(4));v.style.setProperty('--nw',w.w+'px');
    const full=src(w);curFull=full;
    if(LOADED.has(full))vi.src=full;else{vi.src=src(w,true);warm(full,()=>{if(t===tok&&curFull===full)vi.src=full;});}
    vi.alt=w.t+(w.y?', '+w.y:'');
    requestAnimationFrame(()=>vi.classList.remove('swap'));
    vt.textContent=w.t;vy.textContent=w.y||'';vy.hidden=!w.y;
    if(vn)vn.textContent=seq.length>1?(k+1)+' of '+seq.length:'';
    vp.hidden=vq.hidden=seq.length<2;
    try{history.replaceState(null,'','#'+w.s);}catch(e){}
    setTimeout(()=>[k+1,k-1].forEach(n=>warm(src(W[seq[(n+seq.length)%seq.length]]))),60);
    document.dispatchEvent(new CustomEvent('na:show',{detail:{i:seq[k],w}}));
  }
  function open(i,el,within){
    seq=within&&within.length?within.slice():W.map((_,n)=>n);
    back=el||document.activeElement;
    const j=seq.indexOf(i);
    v.hidden=false;document.documentElement.classList.add('v-open');
    show(j<0?0:j);
    requestAnimationFrame(()=>v.classList.add('on'));
    vx.focus({preventScroll:true});
  }
  function close(){
    if(v.hidden)return;
    v.classList.remove('on');v.hidden=true;document.documentElement.classList.remove('v-open');
    tok++;curFull='';vi.removeAttribute('src');vi.style.transform='';vi.style.opacity='';k=-1;
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    if(back&&back.focus)back.focus({preventScroll:true});
    document.dispatchEvent(new CustomEvent('na:close'));
  }
  vp.addEventListener('click',e=>{e.stopPropagation();show(k-1);});
  vq.addEventListener('click',e=>{e.stopPropagation();show(k+1);});
  vx.addEventListener('click',e=>{e.stopPropagation();close();});
  v.addEventListener('click',e=>{if(!e.target.closest('button'))close();});
  addEventListener('keydown',e=>{
    if(v.hidden)return;
    if(e.key==='Escape'){e.preventDefault();close();}
    else if(e.key==='ArrowLeft'){e.preventDefault();show(k-1);}
    else if(e.key==='ArrowRight'){e.preventDefault();show(k+1);}
    else if(e.key==='Tab'){const f=[...v.querySelectorAll('button:not([hidden])')];if(!f.length)return;
      const a=f.indexOf(document.activeElement);e.preventDefault();f[(a+(e.shiftKey?-1:1)+f.length)%f.length].focus();}
  });
  // touch: the painting follows the finger; swipe sideways to move, down to close (same feel as sadh.studio)
  (function(){let x0=null,y0=0,dx=0,dy=0,t0=0,axis='',busy=false;
    const EASE='cubic-bezier(.2,.75,.25,1)';
    const reset=()=>{vi.style.transition='transform .24s '+EASE+', opacity .24s ease';vi.style.transform='';vi.style.opacity='';};
    v.addEventListener('touchstart',e=>{if(busy||v.hidden||e.touches.length!==1){x0=null;return;}
      x0=e.touches[0].clientX;y0=e.touches[0].clientY;dx=dy=0;axis='';t0=Date.now();vi.style.transition='none';},{passive:true});
    v.addEventListener('touchmove',e=>{if(x0===null)return;if(e.touches.length!==1){x0=null;reset();return;}
      dx=e.touches[0].clientX-x0;dy=e.touches[0].clientY-y0;
      if(!axis&&(Math.abs(dx)>8||Math.abs(dy)>8))axis=Math.abs(dx)>Math.abs(dy)?'x':'y';
      if(axis==='x'&&seq.length>1){e.preventDefault();vi.style.transform='translate3d('+dx+'px,0,0)';vi.style.opacity=String(1-Math.min(.35,Math.abs(dx)/innerWidth*.6));}
      else if(axis==='y'){e.preventDefault();const d=Math.max(0,dy);vi.style.transform='translate3d(0,'+d+'px,0) scale('+(1-Math.min(.12,d/innerHeight*.3))+')';vi.style.opacity=String(1-Math.min(.6,d/innerHeight));}},{passive:false});
    v.addEventListener('touchend',e=>{if(x0===null)return;x0=null;const fast=Date.now()-t0<280;
      if(axis==='x'&&seq.length>1&&(Math.abs(dx)>innerWidth*.16||(fast&&Math.abs(dx)>35))){
        e.preventDefault();const d=dx<0?1:-1;busy=true;
        vi.style.transition='transform .15s ease-in, opacity .15s ease-in';vi.style.transform='translate3d('+(-d*innerWidth*.55)+'px,0,0)';vi.style.opacity='0';
        setTimeout(()=>{vi.style.transition='none';vi.style.transform='translate3d('+(d*innerWidth*.3)+'px,0,0)';vi.style.opacity='0';show(k+d);
          requestAnimationFrame(()=>requestAnimationFrame(()=>{reset();setTimeout(()=>{busy=false;},120);}));},150);}
      else if(axis==='y'&&(dy>innerHeight*.16||(fast&&dy>50))){e.preventDefault();reset();close();}
      else if(axis){e.preventDefault();reset();}
      else reset();},{passive:false});
    v.addEventListener('touchcancel',()=>{x0=null;reset();});
  })();
  // deep link: nafsadh.art/#hahakar-4 (later /painting/hahakar-4/)
  function fromHash(){const s=decodeURIComponent(location.hash.slice(1));const i=W.findIndex(w=>w.s===s);if(i>=0)open(i,null);}
  addEventListener('load',fromHash);
  const thumb=(w,cls)=>{const im=document.createElement('img');im.src=src(w,true);im.alt=w.t+(w.y?', '+w.y:'');
    im.width=w.tw;im.height=w.th;im.loading='lazy';im.decoding='async';if(cls)im.className=cls;return im;};
  const label=w=>w.t+(w.y?', '+w.y:'');
  return {D,W,open,close,src,thumb,label};
})();

(function(){
const {W}=NA,$=id=>document.getElementById(id);
const mk=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e;};
$('count').textContent=W.length+' works';
const cap=w=>{const c=mk('figcaption');c.append(mk('span','',w.t));if(w.y)c.append(mk('i','',String(w.y)));return c;};
// lead: the first painting, big
const L=W[0],lead=null;const items=W.map((w,i)=>{const f=mk('figure','work');f.style.setProperty('--c',w.c);
  const b=mk('button');b.type='button';b.setAttribute('aria-label',NA.label(w));b.append(NA.thumb(w));b.addEventListener('click',()=>NA.open(i,b,cur.map(p=>p.i)));
  f.append(b,cap(w));return {f,ar:w.w/w.h,i,k:w.k};});
const hang=$('hang');
function layout(){const n=innerWidth>1200?4:innerWidth>760?3:2;hang.textContent='';const cols=[],hs=[];
  for(let k=0;k<n;k++){const c=mk('div','col');hang.append(c);cols.push(c);hs.push(0);}
  cur.forEach(p=>{let m=0;for(let k=1;k<n;k++)if(hs[k]<hs[m]-.05)m=k;cols[m].append(p.f);hs[m]+=1/p.ar+.3;});}
let cur=items;
function order(sel){cur=sel?items.slice().sort((a,b)=>a.k-b.k):items;
  $('o-year').setAttribute('aria-pressed',!sel);$('o-sel').setAttribute('aria-pressed',sel);
  try{localStorage.setItem('nafsadh-art-order',sel?'sel':'year');}catch(e){}layout();}
$('o-year').onclick=()=>order(false);$('o-sel').onclick=()=>order(true);
try{if(localStorage.getItem('nafsadh-art-order')==='sel'){cur=items.slice().sort((a,b)=>a.k-b.k);$('o-year').setAttribute('aria-pressed','false');$('o-sel').setAttribute('aria-pressed','true');}}catch(e){}
let lw=innerWidth,rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(innerWidth!==lw){lw=innerWidth;layout();}},120);});
layout();
})();
</script>
