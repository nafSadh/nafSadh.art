<style>
:root{--serif:'EB Garamond',Georgia,serif;--serif-alt:'Fraunces',Georgia,serif;

[data-theme="dark"]{--bg:#0b0e18;--bg-2:#0f1322;--bg-3:#151b30;--bg-4:#1d2442;--ink:#eef1fa;--text:#8490aa;
  --dim:#6a7594;--faint:#3b466a;--border:#1c2440;--border-hi:#283558;--accent:#9b7aed;--accent-soft:#9b7aed1f;--link:#7aa2f7;--grain-o:.025;
  --bruple:color-mix(in srgb,var(--accent) 58%,var(--link) 42%);color-scheme:dark}
*{margin:0;padding:0;box-sizing:border-box}[hidden]{display:none!important}
html{background:var(--bg)}html.v-open{overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;position:relative;transition:background .45s ease,color .3s ease}
body::after{content:'';position:fixed;inset:0;pointer-events:none;opacity:var(--grain-o);z-index:9998;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:
  radial-gradient(ellipse 72% 60% at 12% 16%,color-mix(in srgb,var(--link),transparent 86%),transparent 64%),
  radial-gradient(ellipse 68% 55% at 86% 30%,color-mix(in srgb,var(--accent),transparent 86%),transparent 66%),
  radial-gradient(ellipse 78% 68% at 76% 88%,color-mix(in srgb,var(--bruple),transparent 88%),transparent 70%)}
[data-theme="light"] body::before{opacity:.5}
a{color:inherit}
:focus-visible{outline:1px solid var(--accent);outline-offset:3px}
.throwlight{position:fixed;inset:0;z-index:0;pointer-events:none;transition:background 220ms ease;
  background:radial-gradient(560px circle at var(--throw-x) var(--throw-y),color-mix(in srgb,var(--accent),transparent 86%) 0%,color-mix(in srgb,var(--link),transparent 92%) 38%,transparent 66%)}
@media(prefers-reduced-motion:reduce){.throwlight{transition:none}}

.cbtn{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);
  background:color-mix(in srgb,var(--bg-2),transparent 25%);border:1px solid var(--border);padding:6px 10px;
  cursor:pointer;backdrop-filter:blur(8px);transition:color .2s,border-color .2s;text-decoration:none;line-height:1.4;display:inline-flex;align-items:center;gap:6px}
.cbtn:hover{color:var(--accent);border-color:var(--accent)}
.cbtn.on{color:var(--accent);border-color:color-mix(in srgb,var(--accent),transparent 40%);background:var(--accent-soft)}
.cbtn span{color:var(--faint)}
.cbtn.theme-btn{width:31px;padding:0;justify-content:center;height:29px}
.cbtn.theme-btn svg{width:14px;height:14px;display:none}
[data-theme="dark"] .theme-btn .ico-sun{display:block}[data-theme="light"] .theme-btn .ico-moon{display:block}

.mast{max-width:1320px;margin:0 auto;padding:96px 22px 36px;position:relative;z-index:1}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:14px;margin-bottom:28px}
.kicker::before{content:'';width:44px;height:1px;background:var(--accent)}
.title{font-family:var(--serif-alt);font-style:italic;font-weight:500;color:var(--ink);font-size:clamp(60px,9.5vw,124px);line-height:.92;letter-spacing:-.025em;margin-bottom:24px}
.title em{font-style:italic;color:var(--accent);font-weight:400}
.lede{font-family:var(--serif);font-style:italic;font-size:clamp(18px,2vw,23px);color:var(--text);line-height:1.5;max-width:640px}
.lede a{color:var(--accent);text-decoration:none;border-bottom:1px dotted var(--border-hi)}.lede a:hover{border-bottom-color:var(--accent)}
.mast-meta{font-family:var(--mono);font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);margin-top:34px;padding-top:20px;border-top:1px solid var(--border);display:flex;flex-wrap:wrap;gap:4px 22px}
.mast-meta b{color:var(--ink);font-weight:500}

.bar{position:sticky;top:0;z-index:60;background:color-mix(in srgb,var(--bg),transparent 18%);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.bar-in{max-width:1320px;margin:0 auto;padding:10px 22px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.rooms{display:flex;flex-wrap:wrap;gap:6px;flex:1 1 380px;min-width:0}
.ctl{display:flex;align-items:center;gap:6px}
.count{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);white-space:nowrap;margin:0 6px}
@media(max-width:700px){.rooms{flex:1 1 100%}.count{display:none}.ctl{flex:1 1 100%}}

.room{position:relative;z-index:1;max-width:1320px;margin:0 auto;padding:44px 22px 0}
.sub{font-family:var(--mono);font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim);display:flex;align-items:baseline;gap:10px;margin:40px 0 14px}
.sub:first-child{margin-top:0}
.sub b{font-family:var(--serif-alt);font-style:italic;font-weight:500;font-size:22px;letter-spacing:0;text-transform:none;color:var(--ink)}
.wall{display:flex;flex-direction:column;gap:var(--rowgap,22px)}
.grow{display:flex;justify-content:center;align-items:flex-start;gap:var(--colgap,16px)}
.frame{position:relative;overflow:hidden;background:var(--bg-3);cursor:zoom-in;border-radius:2px;flex:0 0 auto;border:0;padding:0;display:block;
  box-shadow:0 0 0 1px color-mix(in srgb,var(--accent),transparent 88%),0 18px 40px -22px rgba(0,0,0,.4)}
[data-theme="dark"] .frame{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent),transparent 90%),0 24px 56px -28px rgba(0,0,0,.85)}
.frame:hover{box-shadow:0 0 0 1px color-mix(in srgb,var(--accent),transparent 55%),0 28px 64px -26px rgba(0,0,0,.6)}
.frame img{width:100%;height:auto;display:block;transition:transform .6s cubic-bezier(.2,.7,.2,1),filter .5s}
.frame:hover img{transform:scale(1.035);filter:brightness(1.04)}
.frame .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;padding:30px 12px 10px;opacity:0;transform:translateY(8px);text-align:left;
  transition:opacity .3s,transform .3s;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.frame:hover .cap,.frame:focus-visible .cap{opacity:1;transform:none}
.cap b{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:15px;color:#fff;line-height:1.25}
.cap i{font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.8px;color:rgba(255,255,255,.75)}
@media(hover:none){.frame .cap{display:none}}

.stroke{display:block;height:2px;width:230px;margin:70px auto 0;background:linear-gradient(90deg,var(--accent),var(--bruple),var(--link),var(--accent));opacity:.42}
.colophon{max-width:1320px;margin:30px auto 0;padding:34px 22px 90px;text-align:center;position:relative;z-index:1}
.colophon em{font-family:var(--serif-alt);font-style:italic;font-weight:500;font-size:32px;color:var(--accent);display:block;margin-bottom:14px}

/* viewer: studio lantern */
.v{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .25s ease;
  --vw-max:calc(100vw - 150px);--vh-max:calc(100svh - 150px);

.v.on{opacity:1}
.v-fig{display:flex;flex-direction:column;align-items:center;gap:18px;cursor:zoom-out}
.v-fig img{display:block;width:min(var(--vw-max),calc(var(--vh-max) * var(--r)),calc(var(--nw) * 1.4));height:auto;aspect-ratio:var(--r);transition:opacity .2s;

.v-fig img.swap{opacity:.85}
.v-cap{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;justify-content:center;text-align:center;padding:0 16px}
.v-t{font-family:var(--serif-alt);font-style:italic;font-weight:500;font-size:clamp(17px,2vw,21px);color:var(--ink)}
.v-y,.v-n{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--dim)}
.v-n{color:var(--faint)}
.v-x{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:18px;font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--dim);background:none;border:0;cursor:pointer;display:inline-flex;align-items:center;gap:6px;padding:6px;z-index:3}
.v-x:hover{color:var(--accent)}
.v-x svg,.v-nav svg{width:12px;height:12px}
.v-nav{position:fixed;top:0;bottom:0;width:72px;border:0;background:none;cursor:pointer;color:var(--dim);display:flex;align-items:center;justify-content:center;z-index:2}
.v-nav svg{width:22px;height:22px;opacity:.6;transition:opacity .2s,transform .2s}
.v-nav:hover{color:var(--accent)}.v-nav:hover svg{opacity:1}
.v-prev{left:0}.v-next{right:0}

</style>

<script>
/* nafsadh.art viewer: shared by every option. Whole painting, never cropped. */
const NA=(()=>{
  const D=JSON.parse(document.getElementById('works').textContent);
  const W=D.works,P=document.body.dataset.p||'../painting/';
  const $=id=>document.getElementById(id);
  const v=$('v'),vi=$('vi'),vt=$('vt'),vy=$('vy'),vn=$('vn'),vx=$('vx'),vp=$('vprev'),vq=$('vnext');
  const src=(w,thumb)=>P+w.s+(thumb?'.thumb.jpg':'.jpg');
  let seq=W.map((_,i)=>i),k=-1,back=null,tok=0;
  function show(j){
    k=(j+seq.length)%seq.length;const w=W[seq[k]],t=++tok;
    v.style.setProperty('--vc',w.c);
    vi.classList.add('swap');
    v.style.setProperty('--r',(w.w/w.h).toFixed(4));v.style.setProperty('--nw',w.w+'px');
    vi.src=src(w,true);vi.alt=w.t+(w.y?', '+w.y:'');
    const hi=new Image();hi.onload=()=>{if(t===tok){vi.src=hi.src;}};hi.src=src(w);
    requestAnimationFrame(()=>vi.classList.remove('swap'));
    vt.textContent=w.t;vy.textContent=w.y||'';vy.hidden=!w.y;
    if(vn)vn.textContent=seq.length>1?(k+1)+' of '+seq.length:'';
    vp.hidden=vq.hidden=seq.length<2;
    try{history.replaceState(null,'','#'+w.s);}catch(e){}
    [k+1,k-1].forEach(n=>{const x=W[seq[(n+seq.length)%seq.length]];(new Image()).src=src(x);});
    document.dispatchEvent(new CustomEvent('na:show',{detail:{i:seq[k],w}}));
  }
  function open(i,el,within){
    seq=within&&within.length?within.slice():W.map((_,n)=>n);
    back=el||document.activeElement;
    const j=seq.indexOf(i);
    v.hidden=false;document.documentElement.classList.add('v-open');
    show(j<0?0:j);
    requestAnimationFrame(()=>v.classList.add('on'));
    vx.focus({preventScroll:true});
  }
  function close(){
    if(v.hidden)return;
    v.classList.remove('on');v.hidden=true;document.documentElement.classList.remove('v-open');
    tok++;vi.removeAttribute('src');k=-1;
    try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}
    if(back&&back.focus)back.focus({preventScroll:true});
    document.dispatchEvent(new CustomEvent('na:close'));
  }
  vp.addEventListener('click',e=>{e.stopPropagation();show(k-1);});
  vq.addEventListener('click',e=>{e.stopPropagation();show(k+1);});
  vx.addEventListener('click',e=>{e.stopPropagation();close();});
  v.addEventListener('click',e=>{if(!e.target.closest('button'))close();});
  addEventListener('keydown',e=>{
    if(v.hidden)return;
    if(e.key==='Escape'){e.preventDefault();close();}
    else if(e.key==='ArrowLeft'){e.preventDefault();show(k-1);}
    else if(e.key==='ArrowRight'){e.preventDefault();show(k+1);}
    else if(e.key==='Tab'){const f=[...v.querySelectorAll('button:not([hidden])')];if(!f.length)return;
      const a=f.indexOf(document.activeElement);e.preventDefault();f[(a+(e.shiftKey?-1:1)+f.length)%f.length].focus();}
  });
  // touch: swipe sideways to move, down to close
  let x0=null,y0=0;
  v.addEventListener('touchstart',e=>{if(e.touches.length!==1){x0=null;return;}x0=e.touches[0].clientX;y0=e.touches[0].clientY;},{passive:true});
  v.addEventListener('touchend',e=>{if(x0===null)return;const t=e.changedTouches[0],dx=t.clientX-x0,dy=t.clientY-y0;x0=null;
    if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.2){show(k+(dx<0?1:-1));e.preventDefault();}
    else if(dy>90&&Math.abs(dy)>Math.abs(dx)*1.5){close();e.preventDefault();}},{passive:false});
  // deep link: nafsadh.art/#hahakar-4 (later /painting/hahakar-4/)
  function fromHash(){const s=decodeURIComponent(location.hash.slice(1));const i=W.findIndex(w=>w.s===s);if(i>=0)open(i,null);}
  addEventListener('load',fromHash);
  const thumb=(w,cls)=>{const im=document.createElement('img');im.src=src(w,true);im.alt=w.t+(w.y?', '+w.y:'');
    im.width=w.tw;im.height=w.th;im.loading='lazy';im.decoding='async';if(cls)im.className=cls;return im;};
  const label=w=>w.t+(w.y?', '+w.y:'');
  return {D,W,open,close,src,thumb,label};
})();

(function(){
const {W,D}=NA,root=document.documentElement,$=id=>document.getElementById(id);
try{const t=localStorage.getItem('nafsadh-art-theme');if(t)root.dataset.theme=t;}catch(e){}
$('theme').onclick=()=>{const t=root.dataset.theme==='dark'?'light':'dark';root.dataset.theme=t;try{localStorage.setItem('nafsadh-art-theme',t);}catch(e){}};
addEventListener('pointermove',e=>{root.style.setProperty('--throw-x',e.clientX+'px');root.style.setProperty('--throw-y',e.clientY+'px');},{passive:true});

const ys=W.filter(w=>w.y).map(w=>w.y);
$('n').textContent=W.length;$('count').textContent=W.length+' works';
$('meta').textContent='by hand, on paper. '+W.length+' works, '+Math.min(...ys)+' to '+Math.max(...ys)+'.';

const frames=W.map((w,i)=>{const b=document.createElement('button');b.type='button';b.className='frame';
  b.setAttribute('aria-label',NA.label(w));b.append(NA.thumb(w));
  const c=document.createElement('span');c.className='cap';c.innerHTML='<b></b>'+(w.y?'<i></i>':'');c.querySelector('b').textContent=w.t;if(w.y)c.querySelector('i').textContent=w.y;b.append(c);
  b.addEventListener('click',()=>NA.open(i,b,order()));return {b,w,i,ar:w.w/w.h};});

let mode='sel';
function order(){return groups().flatMap(g=>g.items.map(f=>f.i));}
function groups(){
  if(mode==='sel')return [{label:null,items:frames}];
  const by={};frames.forEach(f=>{const k=f.w.y||'undated';(by[k]=by[k]||[]).push(f);});
  return Object.keys(by).sort((a,b)=>(a==='undated')-(b==='undated')||a-b).map(k=>({label:k,items:by[k]}));
}
function layout(){
  const H=innerWidth>=1100?240:innerWidth>=760?190:122,gap=innerWidth<600?10:16;
  root.style.setProperty('--colgap',gap+'px');root.style.setProperty('--rowgap',(innerWidth<600?12:20)+'px');
  const room=$('room');room.textContent='';const Wd=room.clientWidth-(innerWidth<600?28:44);
  groups().forEach(g=>{
    if(g.label){const s=document.createElement('div');s.className='sub';s.innerHTML='<b></b><span></span>';s.querySelector('b').textContent=g.label;s.querySelector('span').textContent=g.items.length+(g.items.length>1?' works':' work');room.append(s);}
    const wall=document.createElement('div');wall.className='wall';room.append(wall);
    let row=[],sum=0;
    const flush=last=>{if(!row.length)return;const r=document.createElement('div');r.className='grow';
      let h=(Wd-gap*(row.length-1))/sum;if(last&&h>H*1.15)h=H;h=Math.min(h,H*1.9);
      row.forEach(f=>{f.b.style.width=Math.floor(f.ar*h)+'px';r.append(f.b);});wall.append(r);row=[];sum=0;};
    g.items.forEach(f=>{row.push(f);sum+=f.ar;if(sum*H+gap*(row.length-1)>=Wd)flush(false);});flush(true);
  });
}
function setMode(m){mode=m;$('o-sel').classList.toggle('on',m==='sel');$('o-year').classList.toggle('on',m==='year');
  $('o-sel').setAttribute('aria-pressed',m==='sel');$('o-year').setAttribute('aria-pressed',m==='year');layout();}
$('o-sel').onclick=()=>setMode('sel');$('o-year').onclick=()=>setMode('year');
let lw=innerWidth,rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{if(innerWidth!==lw){lw=innerWidth;layout();}},120);});
layout();
})();
